name: cmd_final
description: "GreenSight Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0

  # --- Navigation ---
  go_router: ^14.8.1

  # --- Networking ---
  http: ^1.2.0

  # --- Local Database (Drift) ---
  drift: ^2.22.1
